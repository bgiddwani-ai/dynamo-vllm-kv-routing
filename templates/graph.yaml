{{- include "dynamo.validate" . -}}
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  backendFramework: vllm
  env:
    - name: PYTHONHASHSEED
      value: "0"
    - name: HF_HOME
      value: /tmp/huggingface
    - name: VLLM_CACHE_ROOT
      value: /cache/vllm
    - name: XDG_CACHE_HOME
      value: /cache
    - name: FLASHINFER_WORKSPACE_BASE
      value: /cache
    - name: TRITON_CACHE_DIR
      value: /cache/triton
    - name: TORCHINDUCTOR_CACHE_DIR
      value: /cache/torchinductor
    - name: CUDA_CACHE_PATH
      value: /cache/cuda
    - name: VLLM_CONFIG_ROOT
      value: /cache/vllm-config
  components:
  {{- range $mode := list "kv" }}
    - name: {{ if eq $mode "kv" }}FrontendKv{{ else }}FrontendRr{{ end }}
      type: frontend
      replicas: 1
      podTemplate:
        metadata:
          labels:
            nic.nvidia.com/release: {{ $.Release.Name }}
            nic.nvidia.com/role: frontend-{{ $mode }}
        spec:
          nodeSelector:
            kubernetes.io/hostname: {{ $.Values.node }}
          securityContext:
            runAsUser: {{ $.Values.user.uid }}
            runAsGroup: {{ $.Values.user.gid }}
            fsGroup: {{ $.Values.user.gid }}
          containers:
            - name: main
              image: {{ $.Values.image | quote }}
              command: [python3, -m, dynamo.frontend]
              args: [--router-mode, {{ $mode | quote }}, --http-port, "8000"]
              env:
                - name: DYN_ROUTER_MODE
                  value: {{ $mode | quote }}
              resources:
                requests: {cpu: {{ $.Values.frontend.cpu | quote }}, memory: {{ $.Values.frontend.memoryRequest }}}
                limits: {memory: {{ $.Values.frontend.memoryLimit }}}
              volumeMounts:
                - {name: model, mountPath: /model-store, readOnly: true, subPath: {{ $.Values.model.subPath }}}
                - {name: cache, mountPath: /cache}
                - {name: dynamo-home, mountPath: /home/dynamo}
          volumes:
            - name: model
              persistentVolumeClaim:
                claimName: {{ $.Values.model.pvc }}
            - name: cache
              emptyDir: {}
            - name: dynamo-home
              emptyDir: {}
  {{- end }}
  {{- $groups := .Values.workerGroups }}
  {{- range $group := $groups }}
  {{- with $ }}
    - name: {{ $group.name }}
      type: worker
      replicas: {{ if hasKey $group "replicas" }}{{ $group.replicas }}{{ else }}{{ .Values.workers.replicas }}{{ end }}
      sharedMemorySize: {{ .Values.workers.sharedMemorySize }}
      podTemplate:
        metadata:
          labels:
            nic.nvidia.com/release: {{ .Release.Name }}
            nic.nvidia.com/role: worker
        spec:
          nodeSelector:
            kubernetes.io/hostname: {{ .Values.node }}
          securityContext:
            runAsUser: {{ .Values.user.uid }}
            runAsGroup: {{ .Values.user.gid }}
            fsGroup: {{ .Values.user.gid }}
          resourceClaims:
            - name: gpu
              resourceClaimTemplateName: {{ .Release.Name }}-{{ $group.claimSuffix }}
          containers:
            - name: main
              image: {{ .Values.image | quote }}
              command: [/bin/bash, -c]
              args:
                - |
                  set -euo pipefail
                  python3 /nic/gpu_guard.py
                  exec {{ if (.Values.workers.safety | default dict).enabled }}python3 /nic/safety_guard.py worker -- {{ end }}python3 -m dynamo.vllm \
                    --model /model-store \
                    --served-model-name {{ .Values.model.servedName }} \
                    --trust-remote-code --seed 1 \
                    --tensor-parallel-size {{ .Values.workers.tensorParallel }} \
                    --max-model-len {{ .Values.workers.maxModelLen }} \
                    --gpu-memory-utilization {{ .Values.workers.gpuMemoryUtilization }} \
                    --quantization modelopt --kv-cache-dtype fp8 \
                    --enable-chunked-prefill \
                    --max-num-batched-tokens {{ .Values.workers.maxBatchedTokens }} \
                    --max-num-seqs {{ .Values.workers.maxSequences }} \
                    --enable-prefix-caching --block-size {{ .Values.workers.blockSize }} \
                    {{- if .Values.workers.conservativeCollectives }}
                    --disable-custom-all-reduce \
                    --compilation-config '{"pass_config":{"fuse_allreduce_rms":false}}' \
                    {{- end }}
                    --kv-events-config '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
              env:
                - name: NIC_ALLOWED_GPUS
                  value: {{ join "," $group.gpuUUIDs | quote }}
                - name: NIC_EXPECTED_GPU_COUNT
                  value: {{ .Values.workers.tensorParallel | quote }}
                - name: NIC_MAX_EXISTING_MEMORY_MIB
                  value: {{ .Values.workers.maxExistingMemoryMiB | quote }}
                {{- if (.Values.workers.safety | default dict).enabled }}
                - name: NIC_MAX_START_TEMP_C
                  value: {{ .Values.workers.safety.startTempC | quote }}
                - name: NIC_MAX_GPU_TEMP_C
                  value: {{ .Values.workers.safety.stopTempC | quote }}
                {{- end }}
                {{- if .Values.workers.conservativeCollectives }}
                - {name: VLLM_ALLREDUCE_USE_SYMM_MEM, value: "0"}
                - {name: VLLM_ALLREDUCE_USE_FLASHINFER, value: "0"}
                - {name: VLLM_USE_NCCL_SYMM_MEM, value: "0"}
                {{- end }}
              resources:
                claims:
                  - name: gpu
                requests:
                  cpu: {{ .Values.workers.cpu | quote }}
                  memory: {{ .Values.workers.memoryRequest }}
                  ephemeral-storage: 20Gi
                limits:
                  memory: {{ .Values.workers.memoryLimit }}
              volumeMounts:
                - {name: model, mountPath: /model-store, readOnly: true, subPath: {{ .Values.model.subPath }}}
                - {name: cache, mountPath: /cache}
                - {name: scripts, mountPath: /nic, readOnly: true}
          volumes:
            - name: model
              persistentVolumeClaim:
                claimName: {{ .Values.model.pvc }}
            - name: cache
              emptyDir: {}
            - name: scripts
              configMap:
                name: {{ .Release.Name }}-scripts
  {{- end }}
  {{- end }}
